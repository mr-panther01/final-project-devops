# Troubleshooting Lab 1: ImagePullBackOff / ErrImagePull
# Scenario: Deployment references a non-existent image tag
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-backend-image
  namespace: taskboard
  labels:
    app: broken-image-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
    spec:
      containers:
        - name: backend
          # Non-existent image tag to trigger ImagePullBackOff
          image: ghcr.io/devops-final/taskboard-backend:non-existent-tag-v999
          ports:
            - containerPort: 8000
