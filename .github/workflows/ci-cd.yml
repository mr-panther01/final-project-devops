name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Quality Gate
  # -------------------------------------------------------------
  test:
    name: Run Pytest & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Quality Gate
        run: |
          cd backend
          pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Job 2: Build Images, Scan with Trivy & Push to GHCR
  # -------------------------------------------------------------
  build-and-security:
    name: Build, Trivy Scan & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Image Locally for scanning
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # Build Frontend Image Locally for scanning
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # Trivy Security Scan on Backend Image (M6 Requirement)
      - name: Trivy Scan Backend Image (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # Trivy Security Scan on Frontend Image (M6 Requirement)
      - name: Trivy Scan Frontend Image (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # Push SHA-tagged images to GHCR
      - name: Push Images to GHCR
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # -------------------------------------------------------------
  # Job 3: Automated Kubernetes Deployment via Helm
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure AWS Credentials (OIDC or Secrets)
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Kubeconfig for EKS
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name taskboard-eks

      - name: Deploy TaskBoard Helm Chart
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }}
