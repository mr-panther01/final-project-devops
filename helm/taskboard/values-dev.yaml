backend:
  replicaCount: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  autoscaling:
    enabled: false

frontend:
  replicaCount: 1

ingress:
  enabled: true
  hosts:
    - host: localhost
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          service: backend
          port: 8000
        - path: /(.*)
          pathType: ImplementationSpecific
          service: frontend
          port: 8080
