global:
  environment: production

# Postgres Configuration (local in-cluster demo database)
postgresql:
  enabled: true
  auth:
    username: taskboard
    password: taskboardpassword123
    database: taskboard
  persistence:
    size: 2Gi
  service:
    port: 5432

# Backend Service
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/yourorg/backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    DATABASE_URL: "postgresql+psycopg://taskboard:taskboardpassword123@taskboard-postgresql:5432/taskboard"

# Frontend Service
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/yourorg/frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Ingress Configuration (M8 Requirement)
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: taskboard.local
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          service: backend
          port: 8000
        - path: /(.*)
          pathType: ImplementationSpecific
          service: frontend
          port: 8080

# Prometheus Monitoring ServiceMonitor (M9)
monitoring:
  enabled: true
  interval: 15s
  path: /metrics
